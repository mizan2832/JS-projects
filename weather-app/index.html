<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container-fluid weather-app">
    <div class="row h-100">

        <!-- Main Weather Panel -->
        <div class="col-lg-8 main-panel d-flex flex-column justify-content-between">
            <div>
                <h5 class="location">United Arab Emirates</h5>
                <p class="datetime">Dubai • Jan 05, 2026 • 7:42 PM</p>
            </div>

            <div class="temp-section">
                <h1 class="temperature">24<span>°C</span></h1>
                <p class="condition">Clear Sky</p>
            </div>

            <div class="row weather-stats">
                <div class="col">
                    <i class="bi bi-thermometer-half"></i>
                    <p>Feels Like</p>
                    <h6>26°C</h6>
                </div>
                <div class="col">
                    <i class="bi bi-droplet"></i>
                    <p>Humidity</p>
                    <h6>47%</h6>
                </div>
                <div class="col">
                    <i class="bi bi-wind"></i>
                    <p>Wind</p>
                    <h6>28 km/h</h6>
                </div>
                <div class="col">
                    <i class="bi bi-speedometer"></i>
                    <p>Pressure</p>
                    <h6>1015 hPa</h6>
                </div>
            </div>
        </div>

        <!-- Side Panel -->
        <div class="col-lg-4 side-panel">
            <div class="search-box">
                <select id="districtSelect" class="form-select">
                    <option value="">Select District</option>
                    <option value="Dhaka">Dhaka</option>
                    <option value="Gazipur">Gazipur</option>
                    <option value="Narayanganj">Narayanganj</option>
                    <option value="Chattogram">Chattogram</option>
                    <option value="Cox's Bazar">Cox's Bazar</option>
                    <option value="Sylhet">Sylhet</option>
                    <option value="Rajshahi">Rajshahi</option>
                    <option value="Khulna">Khulna</option>
                    <option value="Barishal">Barishal</option>
                    <option value="Rangpur">Rangpur</option>
                    <option value="Mymensingh">Mymensingh</option>

                    <!-- add remaining districts -->
                </select>

            </div>

            <h6 class="mt-4">Sun & Moon</h6>
            <div class="sun-info">
                <p>🌅 Sunrise: 6:32 AM</p>
                <p>🌇 Sunset: 5:52 PM</p>
            </div>

            <h6 class="mt-4">5-Day Forecast</h6>
            <div class="forecast">
                <div class="forecast-card">Mon <span>25°C</span></div>
                <div class="forecast-card">Tue <span>27°C</span></div>
                <div class="forecast-card">Wed <span>24°C</span></div>
                <div class="forecast-card">Thu <span>23°C</span></div>
                <div class="forecast-card">Fri <span>26°C</span></div>
            </div>

            <footer class="text-center mt-4">
                <small>Developed by Mizanur Rahman</small>
            </footer>
        </div>

    </div>
</div>

</body>
</html>
